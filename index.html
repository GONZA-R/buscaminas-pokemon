<style>
/* Mismo estilo que «¿Quién es ese Pokémon?»: fondo azul oscuro, amarillo Pokémon, cartas crema. */
:root{
  --bg:#13203b; --panel:#1c2c4e; --line:#2d4170; --fg:#eef2fb; --muted:#9fb0d4;
  --card:#fbf4df; --ink:#1d1b2c; --accent:#ffcb05; --red:#e3350d; --ok:#2fae6b;
  --p1:#4f9bff; --p2:#ff7a59;
  --display:"Press Start 2P",ui-monospace,"Courier New",monospace;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
main{max-width:1100px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:16px}
h1,h2,.px{font-family:var(--display);font-weight:400;letter-spacing:.02em}
h1{font-size:clamp(17px,4.4vw,30px);line-height:1.5;margin:0;color:var(--accent);text-shadow:3px 3px 0 #0a1226}
h2{font-size:12px;line-height:1.7;margin:0;color:var(--accent)}
p{margin:0}
button,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:800;background:var(--panel);color:var(--fg);box-shadow:0 4px 0 #0a1226;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0a1226}
.btn.pri{background:var(--accent);color:var(--ink)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.btn.big{font-size:18px;padding:16px 28px}
.btn.mini{padding:6px 12px}
.btn:disabled{opacity:.5;cursor:wait}
.panel{background:var(--panel);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
input[type=text]{background:#0e1830;color:var(--fg);border:2px solid var(--line);border-radius:10px;padding:11px 12px;min-width:0;flex:1 1 160px}
#codigo{text-transform:uppercase;font-family:var(--display);font-size:14px;letter-spacing:.2em;flex:0 1 150px}
.sp{display:inline-block;width:24px;height:24px;vertical-align:-6px;background:center/contain no-repeat;image-rendering:pixelated}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--accent);color:var(--ink);font-weight:800;padding:10px 16px;border-radius:10px;z-index:20;max-width:calc(100% - 32px);box-shadow:0 4px 0 #0a1226;pointer-events:none;text-align:center}
.toast.mal{background:var(--red);color:#fff}
.toast[hidden]{display:none}
.err{color:#ff9b84;font-weight:700}
footer{font-size:12px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
footer a{color:var(--muted)}

/* ---------- Portada ---------- */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:stretch}
.hero .intro{display:flex;flex-direction:column;gap:14px;justify-content:center}
.lineup{display:flex;gap:6px;align-items:flex-end}
.lineup i{width:64px;height:64px;background:center/contain no-repeat;image-rendering:pixelated}
.como ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt{border:0;border-radius:12px;padding:12px;text-align:left;background:#0e1830;color:var(--fg);box-shadow:inset 0 0 0 2px var(--line);display:flex;flex-direction:column;gap:4px}
.opt b{font-size:16px}
.opt small{color:var(--muted);font-size:12.5px;line-height:1.35}
.opt[aria-pressed=true]{background:var(--accent);color:var(--ink);box-shadow:none}
.opt[aria-pressed=true] small{color:#4a4020}
.opts.dos{grid-template-columns:repeat(2,minmax(0,1fr))}
.gens{display:flex;flex-wrap:wrap;gap:6px}
.gen{border:0;border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;background:#0e1830;color:var(--muted);box-shadow:inset 0 0 0 2px var(--line)}
.gen[aria-pressed=true]{background:var(--accent);color:var(--ink);box-shadow:none}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.start{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:6px 0}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:800;font-size:13px}
.sep::before,.sep::after{content:"";flex:1;height:2px;background:var(--line)}
@media (max-width:860px){.hero,.cols{grid-template-columns:1fr}}
@media (max-width:600px){.opts,.opts.dos{grid-template-columns:1fr}.opt{flex-direction:row;align-items:baseline;gap:10px}.opt b{min-width:80px;flex:none}}

.tabs{display:flex;gap:6px}
.tabs button{flex:1;border:0;border-radius:8px;padding:6px 4px;font-weight:800;font-size:13px;background:#0e1830;color:var(--muted)}
.tabs button[aria-pressed=true]{background:var(--accent);color:var(--ink)}
.recs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:r}
.recs li{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#0e1830;border-radius:9px;padding:7px 10px;counter-increment:r}
.recs li::before{content:counter(r) ".";font-weight:800;color:var(--accent);width:22px}
.recs li .t{font-family:var(--display);font-size:12px;padding-top:2px}
.recs li .q{flex:1;font-size:12px;color:var(--muted)}
.recs li.nuevo{box-shadow:inset 0 0 0 2px var(--accent)}
.recs li.vacio::before{content:none}
.recs li.vacio{color:var(--muted);justify-content:center}

/* Sala de espera online */
.sala{min-height:55vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;background:repeating-linear-gradient(45deg,var(--panel) 0 18px,#182747 18px 36px);border-radius:18px;padding:30px 16px}
.sala .code{font-family:var(--display);font-size:clamp(30px,9vw,48px);letter-spacing:.25em;color:var(--accent);text-shadow:3px 3px 0 #0a1226}
.sala .v{width:72px;height:72px;background:var(--voltorb) center/contain no-repeat;image-rendering:pixelated;animation:rueda 1.6s linear infinite}
@keyframes rueda{to{transform:rotate(360deg)}}

/* ---------- Juego ---------- */
.hud{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px;display:flex;flex-direction:column;gap:8px;margin-top:-8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border-radius:14px;padding:8px 12px}
.vidas{display:flex;gap:4px}
.vidas i{width:26px;height:26px;background:var(--ball) center/contain no-repeat;image-rendering:pixelated;transition:filter .3s,opacity .3s}
.vidas i.perdida{filter:grayscale(1);opacity:.25}
.vidas i.pierde{animation:pierde .6s}
@keyframes pierde{30%{transform:scale(1.6) rotate(-20deg)}100%{transform:none}}
.pts{font-family:var(--display);font-size:16px;color:var(--accent);font-variant-numeric:tabular-nums}
.pts small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:700;margin-right:6px}
/* Contrarreloj */
.crono{font-family:var(--display);font-size:20px;color:var(--fg);font-variant-numeric:tabular-nums;background:#0a1226;border-radius:8px;padding:8px 10px 6px}
.crono.poco{color:var(--red)}
.pts.riv{color:var(--p2)}
.cuenta{font-family:var(--display);font-size:clamp(60px,18vw,110px);color:var(--accent);text-shadow:4px 4px 0 #0a1226;line-height:1.2}
/* Dos jugadores */
.jugs{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:stretch}
.jug{background:var(--panel);border-radius:12px;padding:6px 10px;display:flex;align-items:center;gap:8px;min-width:0;box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .2s,opacity .2s;opacity:.6}
.jug.activo{opacity:1;box-shadow:inset 0 0 0 3px var(--c)}
.jug .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.jug .nm::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:6px}
.jug .vidas i{width:18px;height:18px}
.jug .pts{font-size:13px}
.jug .info{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.jug .fila{display:flex;align-items:center;justify-content:space-between;gap:6px}

.qbox{background:var(--card);color:var(--ink);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 0 #b9ad8a}
.qbox .n{font-family:var(--display);font-size:10px;color:#8a8166;white-space:nowrap}
.qbox .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.qbox .q{font-family:var(--display);font-size:clamp(13px,2.6vw,18px);line-height:1.5}
.qbox .s{font-weight:700;font-size:14px;color:#5b5440}
.qbox .s b{color:var(--ok);font-size:16px}
.qbox .s b.t1{color:#1f63c9}.qbox .s b.t2{color:#d1471f}
.qbox.bien{background:#d9f3e2;box-shadow:0 4px 0 #8fc9a5}
.qbox.bien .q{color:#1e7a46}
.qbox.mal{background:#ffd9d0;box-shadow:0 4px 0 #d39a8b}
.qbox.mal .q{color:#b42a0b}
.qbox i.v{width:48px;height:48px;flex:none;background:var(--voltorb) center/contain no-repeat;image-rendering:pixelated}
.oir{border:0;border-radius:12px;background:var(--accent);color:var(--ink);font-weight:800;padding:10px 12px;box-shadow:0 3px 0 #b08c00;flex:none;font-size:15px}
.oir:active{transform:translateY(2px);box-shadow:0 1px 0 #b08c00}
.bar{height:8px;border-radius:99px;background:#0e1830;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--ok);border-radius:99px;transform-origin:left;transition:background .3s}
.bar i.poco{background:var(--red)}
.bar[hidden]{display:none}

.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
@media (min-width:861px){.board{grid-template-columns:repeat(var(--cols),minmax(0,1fr))}}
.board.shake{animation:shake .45s}
.board.espera .card:not(.ok):not(.boom){opacity:.8}
@keyframes shake{20%{transform:translate(-6px,2px)}40%{transform:translate(6px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,0)}}
.card{position:relative;border:0;border-radius:12px;background:var(--card);color:var(--ink);padding:6px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 #b9ad8a;transition:transform .12s;user-select:none;-webkit-user-select:none;touch-action:manipulation}
@media (hover:hover){.board:not(.espera) .card:not(.ok):not(.boom):hover{transform:translateY(-3px)}}
.card:active{transform:translateY(2px)}
.card img{width:80px;height:80px;image-rendering:pixelated;max-width:100%}
.card .nm{font-weight:800;font-size:13px;line-height:1.15;text-align:center}
.board.nuevo .card{animation:reparte .35s ease backwards;animation-delay:calc(var(--i) * 18ms)}
@keyframes reparte{from{opacity:0;transform:translateY(10px) scale(.9)}}
.card.ok{background:#d9f3e2;box-shadow:0 4px 0 #8fc9a5,inset 0 0 0 3px var(--ok);cursor:default}
.card.ok img{animation:salta .45s}
@keyframes salta{40%{transform:translateY(-10px) scale(1.1)}}
.card.ok::before{content:"✓";position:absolute;top:4px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
.card.ok.j1::before{background:var(--p1)}.card.ok.j2::before{background:var(--p2)}
.card.boom{background:#3a1d24;color:#d9a6a0;box-shadow:0 4px 0 #1b0c10,inset 0 0 0 3px var(--red);cursor:default}
.card.boom img{filter:grayscale(1) brightness(.6);opacity:.55}
.card.boom::before{content:"✕";position:absolute;top:4px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
.card.boom::after{content:"";position:absolute;inset:0;margin:auto;width:90%;height:90%;pointer-events:none;
  background:var(--electrode) center/60% no-repeat,radial-gradient(circle,#fff 0 18%,var(--accent) 30%,var(--red) 52%,transparent 70%);
  image-rendering:pixelated;animation:boom .7s ease-out forwards}
@keyframes boom{0%{transform:scale(.3);opacity:1}45%{transform:scale(1.35);opacity:1}100%{transform:scale(1.6);opacity:0}}
.card.falto{outline:4px solid var(--accent);outline-offset:2px;animation:late .7s infinite alternate}
@keyframes late{to{outline-color:transparent}}
.fin .card{cursor:default}

.msg{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;background:var(--panel);border-radius:16px;padding:18px 16px;border:3px solid var(--red)}
.msg.rec{border-color:var(--accent)}
.msg .pair{display:flex;gap:10px;align-items:flex-end}
.msg .pair i{width:72px;height:72px;background:center/contain no-repeat;image-rendering:pixelated}
.msg b.px{font-size:clamp(13px,3vw,17px);line-height:1.6;color:var(--accent)}
.msg .big{font-family:var(--display);font-size:clamp(20px,5vw,32px);color:var(--fg)}

.salir2{display:none}
@media (max-width:600px){
  body{font-size:14px}
  main{padding:10px 10px 30px;gap:12px}
  .lineup i{width:48px;height:48px}
  .panel{padding:14px}
  .hud{gap:6px;padding:6px 0 8px}
  .top{padding:6px 10px}
  .vidas i{width:22px;height:22px}
  .pts{font-size:13px}
  .jugs{grid-template-columns:1fr 1fr;gap:6px}
  .crono{font-size:15px;padding:7px 7px 5px}
  .top .pts small{display:block;margin:0;font-size:10px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .jugs .btn{grid-column:1 / -1;order:-1;justify-self:end;padding:4px 10px;font-size:13px;display:none}
  .jug{padding:5px 8px}
  .jug .vidas i{width:15px;height:15px}
  .jug .pts{font-size:11px}
  .qbox{padding:9px 10px;gap:8px}
  .qbox i.v{width:34px;height:34px}
  .qbox .s{font-size:13px}
  .oir{padding:8px 9px;font-size:13px}
  .board{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .card{padding:4px 2px 7px;border-radius:9px;box-shadow:0 3px 0 #b9ad8a}
  .card img{width:56px;height:56px}
  .card .nm{font-size:10.5px;overflow-wrap:anywhere}
  .card.ok::before,.card.boom::before{width:18px;height:18px;font-size:11px;top:3px;right:3px}
  .salir2{display:inline-flex}
}
</style>

const GENS = [
  {n:1, region:"Kanto", min:1, max:151}, {n:2, region:"Johto", min:152, max:251},
  {n:3, region:"Hoenn", min:252, max:386}, {n:4, region:"Sinnoh", min:387, max:493},

];
const genOf = id => GENS.find(g => id >= g.min && id <= g.max);
const COLORES = {red:"rojo",blue:"azul",yellow:"amarillo",green:"verde",black:"negro",brown:"marrón",purple:"violeta",gray:"gris",white:"blanco",pink:"rosa"};
// [clave, pregunta, formas de PokeAPI que cuentan como "sí"]
const FORMAS = [
  ["alas", "¿Tiene alas?", ["wings","bug-wings"]],
  ["4p", "¿Anda en cuatro patas?", ["quadruped"]],
  ["2p", "¿Camina en dos patas?", ["upright","humanoid","legs"]],
  ["hum", "¿Tiene forma humana?", ["humanoid"]],
  ["bicho", "¿Tiene cuerpo de insecto?", ["armor","bug-wings"]],
  ["serp", "¿Tiene forma de serpiente o gusano?", ["squiggle"]],
  ["pez", "¿Tiene forma de pez?", ["fish"]],
  ["tent", "¿Tiene tentáculos?", ["tentacles"]],
  ["bola", "¿Es redondo, casi solo cabeza?", ["ball"]],
  ["multi", "¿Tiene varias cabezas o cuerpos?", ["heads"]],
];
const ALTO = {5:"50 cm", 10:"1 m", 20:"2 m"}, PESO = {100:"10 kg", 500:"50 kg", 1000:"100 kg"};
function cumple(id, k){
  const p = BY[id], [a, b] = k.split(":");
  switch (a){
    case "t": return p.t.includes(b);
    case "dos": return p.t.length > 1;
    case "c": return p.c === b;
    case "g": return genOf(id).n === +b;
    case "leg": return !!(p.f & 1);
    case "pre": return !!(p.f & 2);
    case "evo": return !!(p.f & 4);
    case "s": { const f = FORMAS.find(x => x[0] === b); return !!f && f[2].includes(p.s); }
    case "h": return p.h > +b;   // en decímetros
    case "w": return p.w > +b;   // en hectogramos
    case "son": return id === +b; // el que hace el sonido
  }
  return false;
}
function textoQ(k){
  const [a, b] = k.split(":");
  switch (a){
    case "t": return "¿Es de tipo " + TIPOS[b] + "?";
    case "dos": return "¿Tiene dos tipos?";
    case "c": return "¿Es de color " + COLORES[b] + "?";
    case "g": return "¿Es de la Gen " + b + " (" + GENS[b - 1].region + ")?";
    case "leg": return "¿Es legendario o mítico?";
    case "pre": return "¿Evolucionó de otro Pokémon?";
    case "evo": return "¿Puede evolucionar todavía?";
    case "s": return (FORMAS.find(x => x[0] === b) || [])[1] || k;
    case "h": return "¿Mide más de " + ALTO[b] + "?";
    case "w": return "¿Pesa más de " + PESO[b] + "?";
    case "son": return "¿Quién hace este sonido?";
  }
  return k;
}
const esSonido = k => !!k && k.startsWith("son:");
const alto = dm => dm < 10 ? dm * 10 + " cm" : String(dm / 10).replace(".", ",") + " m";
const peso = hg => String(hg / 10).replace(".", ",") + " kg";
// Por qué explotó: le explico al jugador la respuesta correcta.
function porque(id, k){
  const p = BY[id], n = p.n, [a] = k.split(":");
  switch (a){
    case "t": return `${n} es de tipo ${p.t.map(t => TIPOS[t]).join(" y ")}`;
    case "c": return `${n} es de color ${COLORES[p.c]}`;
    case "g": return `${n} es de la Gen ${genOf(id).n}`;
    case "h": return `${n} mide ${alto(p.h)}`;
    case "w": return `${n} pesa ${peso(p.w)}`;
    case "dos": return `${n} tiene un solo tipo`;
    case "leg": return `${n} no es legendario`;
    case "pre": return `${n} no evolucionó de otro`;
    case "evo": return `${n} ya no evoluciona más`;
    case "s": return `${n} no tiene esa forma`;
    case "son": return `ese sonido no es de ${n}`;
  }
  return n;
}

function recortar(src){   // saco el borde transparente de los sprites chicos
  return new Promise(ok => {
    const im = new Image();
    im.onload = () => {
      try {
        const w = im.width, h = im.height, cv = document.createElement("canvas"); cv.width = w; cv.height = h;
        const cx = cv.getContext("2d"); cx.drawImage(im, 0, 0);
        const d = cx.getImageData(0, 0, w, h).data;
        let x0 = w, y0 = h, x1 = -1, y1 = -1;
        for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 10) {
          if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
        }
        if (x1 < 0) return ok(src);
        const s = Math.max(x1 - x0 + 1, y1 - y0 + 1), out = document.createElement("canvas"); out.width = s; out.height = s;
        out.getContext("2d").drawImage(im, x0, y0, x1 - x0 + 1, y1 - y0 + 1, Math.floor((s - (x1 - x0 + 1)) / 2), Math.floor((s - (y1 - y0 + 1)) / 2), x1 - x0 + 1, y1 - y0 + 1);
        ok(out.toDataURL());
      } catch (e) { ok(src); }
    };
    im.onerror = () => ok(src);
    im.src = src;
  });
}

function tono(f, d, tipo = "square", vol = .05, t0 = 0, f2 = null){
  const t = AC.currentTime + t0, o = AC.createOscillator(), g = AC.createGain();
  o.type = tipo; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02);
}
function ruido(d, vol = .3){
  const n = AC.sampleRate * d, b = AC.createBuffer(1, n, AC.sampleRate), ch = b.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
  const s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = 900; s.buffer = b; g.gain.value = vol;
  s.connect(f).connect(g).connect(AC.destination); s.start();
}

const PRUEBA = new URLSearchParams(location.search).has("prueba");
function dbPrueba(){
  const K = p => "bmdb:" + p, subs = new Map();
  const read = p => { try { return JSON.parse(localStorage.getItem(K(p)) || "null"); } catch (e) { return null; } };
  const fire = p => (subs.get(p) || []).forEach(fn => fn(read(p)));
  addEventListener("storage", e => { if (e.key && e.key.startsWith("bmdb:")) fire(e.key.slice(5)); });
  return {
    get: async p => read(p),
    set: async (p, v) => {
      const partes = p.split("/"), raiz = partes.slice(0, 2).join("/");
      if (partes.length > 2) { const o = read(raiz) || {}; let x = o; partes.slice(2, -1).forEach(k => x = x[k] = x[k] || {}); x[partes[partes.length - 1]] = v; v = o; }
      localStorage.setItem(K(raiz), JSON.stringify(v)); setTimeout(() => fire(raiz), 0);
    },
    on: (p, fn) => { subs.set(p, [...(subs.get(p) || []), fn]); setTimeout(() => fn(read(p)), 0); return () => subs.set(p, (subs.get(p) || []).filter(f => f !== fn)); },
  };
}

function candidatas(g){
  const D = DIFS[g.dif], b = g.board, ks = new Set(["dos", "leg", "pre", "evo", "h:5", "h:10", "h:20", "w:100", "w:500", "w:1000"]);

function tocarG(g, id){
  if (g.estado !== "jugando" || g.ok.includes(id) || g.boom.includes(id)) return false;

  } else {

function completar(g){
  const j = g.jug[g.turno];
  const seg = g.fin ? Math.max(0, Math.ceil((g.fin - ahora()) / 1000)) : Math.max(0, 20 - Math.floor((ahora() - g.t0) / 1000));
  const extra = g.cr ? 15 + (g.limpia ? 10 : 0) : dos(g) ? 15 : 20 + seg + (g.limpia ? 15 : 0);

  }
  if (G.m !== "online") { dif = G.dif; gens = [...G.gens]; modo = G.m; const noms = G.jug.map(j => j.n), emp = G.empieza; G = nuevoG(modo, noms); G.empieza = 1 - emp; deCero(); siguiente(G); publicar(); return; }
  const v = G, g = { ...nuevoG("online", v.jug.map(j => j.n)), dif: v.dif, gens: v.gens, p1: v.p1, p2: v.p2, code: v.code, empieza: 1 - v.empieza, seq: (v.seq || 0) + 1 };
  g.ev = { seq: (v.ev.seq || 0) + 1 };
  G = g; finVisto = false; siguiente(G); publicar();
}
function salir(){
  if (G && G.cr) {
    if (G.estado !== "fin" && G.estado !== "cuenta" && !confirm(G.cr.sala === "online" ? "¿Salís de la partida? Gana tu rival." : "¿Salís de la partida?")) return;
    if (G.cr.sala === "online" && G.estado !== "fin" && CODE) DB.set(ruta(CODE) + "/aband", yo).catch(() => {});
    return portada();
  }
  if (G && G.m === "online" && G.estado !== "fin") {
    if (!confirm("¿Salís de la partida? Gana tu rival.")) return;
    G.estado = "fin"; G.motivo = "abandono"; G.ganador = 1 - yo; G.ev = { ...G.ev, seq: G.ev.seq + 1, tipo: "fin" };
    G.seq = (G.seq || 0) + 1; DB.set(ruta(CODE), JSON.parse(JSON.stringify(G))).catch(() => {});
  } else if (G && G.estado !== "fin" && G.nPreg > 1 && !confirm("¿Salís de la partida?")) return;
  portada();
}

/* ---------- contrarreloj ----------
   Cada jugador tiene sus propias preguntas; solo se comparte el puntaje. Termina cuando se acaba el tiempo de la partida. */
const reloj2 = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
function crearP(n, d, gs, inicio, fin, sala){
  const g = nuevoG("cr", [n]);
  g.dif = d; g.gens = [...gs]; g.cr = { inicio, fin, sala, dur: Math.round((fin - inicio) / 60000) }; g.estado = "cuenta"; g.hechas = 0; g.saltadas = 0;
  return g;
}
function empezarCR(sala){
  const n = sala === "local" ? LCR.noms[LCR.idx] : "Vos", ini = ahora() + 3500;
  G = crearP(n, dif, gens, ini, ini + dur * 60000, sala); yo = 0; deCero(); mostrar();
}
function pantallaCuenta(){
  const c = G.cr, D = c.dur;
  $app.innerHTML = `<div class="sala">
    <h2>${c.sala === "local" ? `Le toca a ${esc(G.jug[0].n)}` : c.sala === "online" ? `${esc(G.jug[0].n)} contra ${esc(c.rivalN || "tu rival")}` : "¡Preparate!"}</h2>
    <div class="cuenta" id="cuentaN">${Math.max(1, Math.ceil((c.inicio - ahora()) / 1000))}</div>
    <p class="muted">Contrarreloj · ${D} min · ${DIFS[G.dif].n}<br>Si errás, pasás de pregunta. ¡Hacé todos los puntos que puedas!</p>
    <button class="btn ghost mini" id="salir">Salir</button>
  </div>`;
}
function finCR(){
  if (!G || !G.cr || G.estado === "fin") return;
  G.estado = "fin"; clearInterval(reloj); sfx("tiempo"); vibrar(200);
  publicar();
  if (G.cr.sala === "local" && LCR && LCR.idx === 0) { LCR.res[0] = G.jug[0].pts; return setTimeout(pantallaPase, 900); }
  if (G.cr.sala === "local" && LCR) LCR.res[1] = G.jug[0].pts;
  setTimeout(() => finalCR(false), G.cr.sala === "online" ? 1600 : 500);
}
function pantallaPase(){
  $app.innerHTML = `<div class="sala">
    <h2>¡Tiempo, ${esc(LCR.noms[0])}!</h2>
    <div class="cuenta" style="font-size:clamp(34px,10vw,56px)">${LCR.res[0]} pts</div>
    <p class="muted">Ahora le toca a <b>${esc(LCR.noms[1])}</b>. Pasale el celu (o la compu).</p>
    <button class="btn pri big" id="sigJug">¡Empezar, ${esc(LCR.noms[1])}!</button>
  </div>`;
}
function finalCR(silencio){
  if (!G || !G.cr || !$("hud")) return;
  const c = G.cr, D = c.dur;
  let titulo, grande, sub = `Completaste ${G.hechas} ${G.hechas === 1 ? "pregunta" : "preguntas"} y te explotaron ${G.saltadas}. Contrarreloj ${D} min · ${DIFS[G.dif].n}.`, bueno = false;
  if (c.sala === "solo") {
    const pos = silencio ? -1 : anotar(); bueno = pos === 0;
    titulo = bueno ? "¡Nuevo récord!" : "¡Se acabó el tiempo!"; grande = G.jug[0].pts + " pts";
    if (pos > 0) sub += ` Quedaste ${pos + 1}.º en tus récords.`;
  } else {
    const filas = c.sala === "local" ? LCR.noms.map((n, i) => ({ n, p: LCR.res[i] || 0 }))
      : [{ n: G.jug[0].n, p: G.jug[0].pts }, { n: c.rivalN || "Rival", p: (c.rival || {}).pts || 0 }];
    const [a, b] = filas, fue = c.sala === "online" && c.aband != null && c.aband !== yo;
    const gana = fue ? 0 : a.p === b.p ? -1 : a.p > b.p ? 0 : 1;
    titulo = gana === -1 ? "¡Empate!" : c.sala === "online" ? (gana === 0 ? "¡Ganaste!" : `Ganó ${filas[1].n}`) : `¡Ganó ${filas[gana].n}!`;
    grande = filas.map(f => `${esc(f.n)}: ${f.p}`).join(" · ");
    if (fue) sub = `${esc(filas[1].n)} se fue de la partida.`;
    else if (c.sala === "local") sub = `Contrarreloj ${D} min · ${DIFS[G.dif].n}.`;
    bueno = c.sala === "local" || gana !== 1;
  }
  if (!silencio) setTimeout(() => sfx(bueno ? "record" : "fin"), 300);
  const viejo = $("msg"); if (viejo) viejo.remove();
  const hud = $("hud");
  hud.insertAdjacentHTML("afterbegin", `<div class="msg${bueno ? " rec" : ""}" id="msg">
    <div class="pair"><i style="background-image:url(${bueno ? IMG.eevee : IMG.psyduck})"></i><i style="background-image:url(${IMG.electrode})"></i></div>
    <b class="px">${esc(titulo)}</b>
    <span class="big">${grande}</span>
    <span class="muted">${sub}</span>
    <div class="row" style="justify-content:center"><button class="btn pri" id="otra">${c.sala === "solo" ? "Jugar otra vez" : "Revancha"}</button><button class="btn ghost" id="inicio">Inicio</button></div>
  </div>`);
  hud.style.position = "static";
  if ($("board")) $("board").classList.add("fin");
  scrollTo({ top: 0, behavior: "smooth" });
}
function arrancarSalaCR(s){
  const ini = ahora() + 4000;
  s.estado = "cr"; s.inicio = ini; s.fin = ini + s.dur * 60000; s.res = { 0: { pts: 0 }, 1: { pts: 0 } }; delete s.aband;
  DB.set(ruta(CODE), JSON.parse(JSON.stringify(s))).catch(() => toast("No se pudo arrancar la partida.", true));
}
async function salaCR(s){
  SALA = s;
  if (s.estado === "espera") return pantallaEspera(false, s);
  if (s.estado === "lista") {
    if (yo === 0) { if (await cargarGens(s.gens)) arrancarSalaCR(s); }
    else pantallaEspera(true, s);
    return;
  }
  if (s.estado !== "cr") return;
  if (!await cargarGens(s.gens)) return;
  const nueva = !G || !G.cr || G.cr.inicio !== s.inicio;
  if (nueva && ahora() > s.fin) { toast("Esa partida ya terminó."); return portada(); }
  if (nueva) { G = crearP(s.jug[yo].n, s.dif, s.gens, s.inicio, s.fin, "online"); deCero(); }
  const res = s.res || {};
  G.cr.rival = res[1 - yo] || { pts: 0 }; G.cr.rivalN = s.jug[1 - yo].n;
  if (s.aband != null && s.aband !== yo && G.cr.aband == null) { G.cr.aband = s.aband; toast(`${G.cr.rivalN} se fue de la partida`, true); }
  if (G.estado === "fin" && $("msg")) return finalCR(true);
  mostrar();
}

/* ---------- clics ---------- */
$app.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.classList.contains("card")) return tocar(+t.dataset.id);
  if (t.dataset.modo) { leerNombres(); modo = t.dataset.modo; guardar("bmp_modo", modo); document.querySelectorAll("[data-modo]").forEach(b => b.setAttribute("aria-pressed", b.dataset.modo === modo)); modoExtra(); return; }
  if (t.dataset.dif) { dif = t.dataset.dif; verRec = dif; guardar("bmp_dif", dif); document.querySelectorAll("[data-dif]").forEach(b => b.setAttribute("aria-pressed", b.dataset.dif === dif)); records(); return; }
  if (t.dataset.gen) {
    if (t.dataset.gen === "todas") gens = gens.length === GENS.length ? [1] : GENS.map(g => g.n);
    else { const n = +t.dataset.gen; gens = gens.includes(n) ? (gens.length > 1 ? gens.filter(x => x !== n) : gens) : [...gens, n].sort((a, b) => a - b); }
    guardar("bmp_gens", gens);
    document.querySelectorAll(".gen").forEach(b => b.setAttribute("aria-pressed", b.dataset.gen === "todas" ? gens.length === GENS.length : gens.includes(+b.dataset.gen)));
    return;
  }
  if (t.dataset.rec) { verRec = t.dataset.rec; records(); return; }
  if (t.dataset.reglas) { reglas = t.dataset.reglas; guardar("bmp_reglas", reglas); document.querySelectorAll("[data-reglas]").forEach(b => b.setAttribute("aria-pressed", b.dataset.reglas === reglas)); $("durs").hidden = reglas !== "cr"; records(); return; }
  if (t.dataset.dur) { dur = +t.dataset.dur; guardar("bmp_dur", dur); document.querySelectorAll("[data-dur]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.dur === dur)); records(); return; }
  switch (t.id) {
    case "jugar": return empezar();
    case "crear": return crearOnline();
    case "unirse": return unirse();
    case "otra": return revancha();
    case "sigJug": LCR.idx = 1; return empezarCR("local");
    case "inicio": return portada();
    case "salir": case "salirAbajo": return salir();
    case "cancelar": { const c = CODE; salirOnline(); if (DB && c) DB.set(ruta(c), null).catch(() => {}); return portada(); }
    case "oir": return G && esSonido(G.k) && grito(G.k.split(":")[1]);
    case "snd": SND = !SND; guardar("bmp_snd", SND); sndBtn(); if (SND) sfx("si"); return;
  }
});
$app.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "codigo") unirse(); });

/* ---------- arranque ---------- */
(async () => {
  for (const [k, v] of Object.entries(RAW)) IMG[k] = k === "ball" ? v : await recortar(v);
  const r = document.documentElement.style;
  r.setProperty("--ball", `url(${IMG.ball})`); r.setProperty("--voltorb", `url(${IMG.voltorb})`); r.setProperty("--electrode", `url(${IMG.electrode})`);
  // Si recargó la página en medio de una partida online, lo vuelvo a meter.
  let c = ""; try { c = sessionStorage.getItem("bm_code") || ""; } catch (e) {}
  if (c && await conectar()) {
    const g = normal(await DB.get(ruta(c)).catch(() => null));
    if (g && (g.p1 === UID || g.p2 === UID) && g.estado !== "fin") return entrar(c, g.p1 === UID ? 0 : 1);
  }
  portada();
  gens.forEach(n => cargarGen(n).catch(() => {}));   // las voy bajando mientras elige
})();
